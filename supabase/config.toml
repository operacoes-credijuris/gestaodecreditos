# Configuração da CLI do Supabase para este projeto.
# Para conectar ao seu projeto remoto: supabase link --project-ref <ref-do-projeto>
project_id = "credijuris-sistema"

[api]
enabled = true

[db]
# Versão do Postgres (ajuste se necessário ao do seu projeto).
major_version = 15

[functions.admin-create-user]
verify_jwt = true

[functions.admin-update-user]
verify_jwt = true

[functions.salvar-token-advbox]
verify_jwt = true

# Chamada tanto pelo app (JWT do usuário) quanto pelo cron (x-cron-secret, na
# action 'sync' que alimenta o cache das fichas); a própria função valida a
# autorização, por isso verify_jwt = false.
[functions.advbox-tarefas]
verify_jwt = false

# Chamada tanto pelo app (JWT do usuário) quanto pelo cron (x-cron-secret);
# a própria função valida a autorização, por isso verify_jwt = false.
[functions.djen-publicacoes]
verify_jwt = false

[functions.advbox-movimentacoes]
verify_jwt = false

[functions.salvar-token-kommo]
verify_jwt = true

# Chamada pelo app (JWT do usuário) e pelo cron (x-cron-secret); a própria
# função valida a autorização, por isso verify_jwt = false.
[functions.kommo-sync]
verify_jwt = false

# Escreve no Kommo em nome de um usuário: exige autenticação, nunca cron.
[functions.kommo-mover]
verify_jwt = true

# Assistente de dados: lê o banco sob as RLS de quem perguntou, então precisa
# do JWT do usuário. Nunca é chamado por cron.
[functions.assistente]
verify_jwt = true

[functions.salvar-token-anthropic]
verify_jwt = true

# Resumos da carteira: chamada pelo app (JWT do usuário, botões de gerar) e pelo
# cron semanal (x-cron-secret); a própria função valida a autorização.
[functions.carteira-resumo]
verify_jwt = false

# Extração dos campos do crédito a partir dos documentos da pasta no Drive.
# Sempre disparada por uma pessoa, na aba Automatizado do novo crédito — nunca por
# cron. Então o JWT é exigido no portão da plataforma, antes de a função rodar e
# antes de gastar uma chamada de IA.
[functions.extrair-credito]
verify_jwt = true

# Cadastro do processo na ADVBOX ao salvar o crédito. Só é disparada por pessoa —
# ao salvar um crédito, ou ao carregar as opções na tela de Configurações. Nunca
# por cron, e ela ESCREVE no sistema do escritório: o JWT é exigido no portão.
[functions.advbox-processos]
verify_jwt = true

# SELIC e IPCA do Banco Central. Chamada pelo cron semanal (x-cron-secret) e pelo
# botão "Buscar no Banco Central" (JWT do usuário); a própria função valida os dois.
[functions.parametros-bcb]
verify_jwt = false

# Monta o checklist de certidões do crédito. Sempre disparada por uma pessoa, no
# botão de análise — nunca por cron, porque quem pede a análise é o operacional,
# na hora. E ela ESCREVE o checklist congelado: o JWT é exigido no portão.
[functions.gerar-checklist-certidoes]
verify_jwt = true
