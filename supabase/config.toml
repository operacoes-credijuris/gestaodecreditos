# Configuração da CLI do Supabase para este projeto.
# Para conectar ao seu projeto remoto: supabase link --project-ref <ref-do-projeto>
project_id = "credijuris-sistema"

[api]
enabled = true

[db]
# Versão do Postgres (ajuste se necessário ao do seu projeto).
major_version = 15

[functions.admin-create-user]
verify_jwt = true

[functions.admin-update-user]
verify_jwt = true

[functions.salvar-token-advbox]
verify_jwt = true

# Chamada tanto pelo app (JWT do usuário) quanto pelo cron (x-cron-secret, na
# action 'sync' que alimenta o cache das fichas); a própria função valida a
# autorização, por isso verify_jwt = false.
[functions.advbox-tarefas]
verify_jwt = false

# Chamada tanto pelo app (JWT do usuário) quanto pelo cron (x-cron-secret);
# a própria função valida a autorização, por isso verify_jwt = false.
[functions.djen-publicacoes]
verify_jwt = false

[functions.advbox-movimentacoes]
verify_jwt = false

[functions.salvar-token-kommo]
verify_jwt = true

# Chamada pelo app (JWT do usuário) e pelo cron (x-cron-secret); a própria
# função valida a autorização, por isso verify_jwt = false.
[functions.kommo-sync]
verify_jwt = false

# Escreve no Kommo em nome de um usuário: exige autenticação, nunca cron.
[functions.kommo-mover]
verify_jwt = true

# Assistente de dados: lê o banco sob as RLS de quem perguntou, então precisa
# do JWT do usuário. Nunca é chamado por cron.
[functions.assistente]
verify_jwt = true

[functions.salvar-token-anthropic]
verify_jwt = true

# Resumos da carteira: chamada pelo app (JWT do usuário, botões de gerar) e pelo
# cron semanal (x-cron-secret); a própria função valida a autorização.
[functions.carteira-resumo]
verify_jwt = false

# Extração dos campos do crédito a partir dos documentos da pasta no Drive.
# Sempre disparada por uma pessoa, na aba Automatizado do novo crédito — nunca por
# cron. Então o JWT é exigido no portão da plataforma, antes de a função rodar e
# antes de gastar uma chamada de IA.
[functions.extrair-credito]
verify_jwt = true

# Cadastro do processo na ADVBOX ao salvar o crédito. Só é disparada por pessoa —
# ao salvar um crédito, ou ao carregar as opções na tela de Configurações. Nunca
# por cron, e ela ESCREVE no sistema do escritório: o JWT é exigido no portão.
[functions.advbox-processos]
verify_jwt = true

# SELIC e IPCA do Banco Central. Chamada pelo cron semanal (x-cron-secret) e pelo
# botão "Buscar no Banco Central" (JWT do usuário); a própria função valida os dois.
[functions.parametros-bcb]
verify_jwt = false

# Monta o checklist de certidões do crédito. Sempre disparada por uma pessoa, no
# botão de análise — nunca por cron, porque quem pede a análise é o operacional,
# na hora. E ela ESCREVE o checklist congelado: o JWT é exigido no portão.
[functions.gerar-checklist-certidoes]
verify_jwt = true

# Gera os contratos (.docx) e sobe no Drive. Sempre disparada por uma pessoa na
# tela de Geração de Contratos — nunca por cron. Escreve em `contratos` e no
# Drive do escritório: o JWT é exigido no portão.
[functions.gerar-contrato]
verify_jwt = true

# Põe no balcão o texto dos autos de um card, para o Claude vir buscar pelo
# conector. Sempre disparada por uma pessoa, no botão "Executar análise" do
# precatório externo — e o que ela guarda são os autos de um processo: o JWT é
# exigido no portão, e a função ainda confere se a conta está ATIVA.
[functions.autos-guardar]
verify_jwt = true

# O conector (MCP) pelo qual o aplicativo do Claude busca os autos.
#
# SEM JWT PORQUE NÃO HÁ COMO TER UM: quem chama é o aplicativo do Claude, que não
# conhece o Supabase nem a sessão de quem está usando a plataforma. O que
# autoriza a leitura é o CÓDIGO da análise — um uuid que nasce no clique, vale
# duas horas e serve a um card só. Sem código válido a função não devolve nada, e
# um código inexistente recebe a mesma resposta de um vencido.
[functions.mcp-autos]
verify_jwt = false

# O aviso do Escavador de que um processo terminou de atualizar.
#
# SEM JWT PORQUE QUEM CHAMA É O ESCAVADOR, de fora, e não tem sessão nossa. O que
# autoriza é o token gerado no painel deles e enviado no header Authorization —
# a função o confere contra o que está gravado em integracao_escavador_secret e,
# se ele não estiver configurado, RECUSA tudo em vez de aceitar tudo.
[functions.escavador-callback]
verify_jwt = false

# Os autos do Escavador para o card do Kommo. Chamada pelo cron (x-cron-secret),
# por ela mesma em voltas encadeadas e pelo app (JWT do usuário); a própria
# função valida a autorização, por isso verify_jwt = false.
[functions.escavador-autos-rotina]
verify_jwt = false

# Fase processual: chamada pelo app (JWT do usuário) e pelo cron diário, que só
# leva o x-cron-secret. Sem esta entrada valia o padrão (verify_jwt = true), e o
# gateway recusava o cron com 401 antes de a função conferir o segredo — a
# varredura diária nunca rodou (auditoria de 23/10/2026). Toda ação confere quem
# chama no código (getCallerAtivo ou o segredo do cron).
[functions.fase-processual]
verify_jwt = false

# Justificativa técnica da proposta: chamada pelo app (JWT do usuário), por ela
# mesma, para encadear as etapas da geração (service_role), e pelo cron do vigia
# (x-cron-secret). A própria função confere quem pode cada ação: gerar,
# rascunho, enviar e vigiar pedem getCallerAtivo; passo e vigiar-todas, o
# segredo do cron ou a service_role.
#
# verify_jwt = false DESDE 23/10/2026: com o gateway conferindo o JWT, o cron do
# vigia levava 401 "UNAUTHORIZED_INVALID_JWT_FORMAT" a cada 2 minutos, antes de
# a função ver o segredo — o mesmo motivo da fase-processual acima.
[functions.justificativa-tecnica]
verify_jwt = false
