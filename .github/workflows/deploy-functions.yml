name: Deploy Supabase Functions

# Sobe as Edge Functions para o Supabase sempre que algo em supabase/functions
# (ou o config.toml) muda no main. Também pode ser disparado manualmente.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # As Edge Functions rodam em Deno, então o `tsc --noEmit` do site não as
      # cobre. Sem este passo, erro de tipo em função só apareceria em produção
      # — o deploy abaixo é automático a cada push.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --node-modules-dir=none: o package.json do site na raiz faz o Deno
      # procurar node_modules; as funções resolvem npm: pelo cache dele.
      - name: Verificação de tipos das Edge Functions
        run: deno check --node-modules-dir=none supabase/functions

      - name: Deploy de todas as Edge Functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
