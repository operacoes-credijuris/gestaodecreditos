name: Deploy Supabase Functions

# Sobe as Edge Functions para o Supabase sempre que algo em supabase/functions
# (ou o config.toml) muda no main. Também pode ser disparado manualmente.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      # AS VERSÕES SOBEM PORQUE O NODE 20 ESTÁ SENDO APOSENTADO.
      #
      # O runner passou a avisar que checkout@v4 e setup-cli@v1 foram publicados
      # para Node 20 e estavam sendo FORÇADOS a rodar em Node 24. Enquanto ele
      # força, tudo funciona; no dia em que parar, o deploy quebra sozinho, sem
      # ninguém ter tocado no projeto — e é o passo que publica as functions.
      #
      # checkout: v4 -> v7. As três viradas de versão maior não mexem em nada
      # que usamos: v5 só troca o runtime, v6 guarda as credenciais em arquivo
      # separado (não empurramos nada daqui) e v7 bloqueia checkout de fork em
      # pull_request_target/workflow_run (só temos push e disparo manual).
      # setup-cli: v1 -> v3, e ele virou action de shell em vez de Node — é por
      # isso que sai do aviso. O input `version` continua o mesmo.
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # As Edge Functions rodam em Deno, então o `tsc --noEmit` do site não as
      # cobre. Sem este passo, erro de tipo em função só apareceria em produção
      # — o deploy abaixo é automático a cada push.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --node-modules-dir=none: o package.json do site na raiz faz o Deno
      # procurar node_modules; as funções resolvem npm: pelo cache dele.
      - name: Verificação de tipos das Edge Functions
        run: deno check --node-modules-dir=none supabase/functions

      - name: Deploy de todas as Edge Functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
