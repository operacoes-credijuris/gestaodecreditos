name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v4 -> v7: o runner avisou que a v4 foi publicada para Node 20, que está
      # sendo aposentado, e estava sendo forçada a rodar em Node 24. Ver o
      # comentário em deploy-functions.yml — nenhuma das viradas mexe no que
      # usamos aqui, que é um checkout sem parâmetro nenhum.
      - uses: actions/checkout@v7

      # `node-version: 20` é OUTRA coisa, e fica como está de propósito: é o Node
      # que COMPILA o site, não o runtime da action, e não entra na
      # aposentadoria. Trocá-lo muda o que sai no bundle, então é mudança
      # separada, com o site conferido depois.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Em `vars`, não `secrets`: o ID do cliente OAuth é público por design —
          # fica visível no código do site. Quem protege o acesso são as origens
          # autorizadas no Google Cloud e o login de cada pessoa. Como variável, o
          # valor aparece no log do build, o que ajuda a depurar quando o Drive
          # recusa a autorização.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
