name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes. SEM CANCELAR O QUE ESTÁ EM ANDAMENTO: desde que a
# beta passou a ser publicada por aqui (job build, passos "Beta"), um disparo
# vindo da branch `redesenho` cancelaria no meio uma publicação oficial. Assim
# a nova espera a anterior terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # OS TESTES ANTES DO BUILD: teste quebrado barra a publicação. Até 02/10/2026 o
  # site subia só com o build — e o build passa com teste vermelho, porque
  # tipagem não confere regra de negócio (colunas do Kommo, destinos que o
  # servidor aceita, contas da carteira).
  #
  # NUM JOB À PARTE, COM NODE 22: o supabase-js atual exige WebSocket nativo fora
  # do navegador, que o Node 20 não tem, e os testes que importam o cliente caem
  # na carga ("Node.js 20 detected without native WebSocket support"). O build
  # continua no Node 20 pelo motivo escrito lá embaixo; aqui o Node só RODA os
  # testes, não produz nada que vá para o site.
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      # v4 -> v7: o runner avisou que a v4 foi publicada para Node 20, que está
      # sendo aposentado, e estava sendo forçada a rodar em Node 24. Ver o
      # comentário em deploy-functions.yml — nenhuma das viradas mexe no que
      # usamos aqui, que é um checkout sem parâmetro nenhum.
      - uses: actions/checkout@v7

      # v4 -> v7. As duas viradas com mudança declarada são sobre CACHE
      # AUTOMÁTICO: a v5 passou a cachear sozinha quando há `packageManager` no
      # package.json e a v6 limitou isso ao npm. Como já pedimos `cache: npm`
      # explicitamente, o comportamento é o mesmo. A v7 é migração para ESM.
      #
      # `node-version: 20` é OUTRA coisa, e fica como está de propósito: é o Node
      # que COMPILA o site, não o runtime da action, e não entra na
      # aposentadoria. Trocá-lo muda o que sai no bundle, então é mudança
      # separada, com o site conferido depois.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Em `vars`, não `secrets`: o ID do cliente OAuth é público por design —
          # fica visível no código do site. Quem protege o acesso são as origens
          # autorizadas no Google Cloud e o login de cada pessoa. Como variável, o
          # valor aparece no log do build, o que ajuda a depurar quando o Drive
          # recusa a autorização.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build

      # ======================================================================
      # A VERSÃO BETA, em /gestaodecreditos/beta/ — o redesenho visto antes de
      # chegar à equipe (ver PLANO-DE-IMPLEMENTACAO.md, seção 2).
      #
      # POR QUE AQUI, DENTRO DA PUBLICAÇÃO OFICIAL: o Pages publica UM pacote que
      # substitui o site inteiro, e o ambiente github-pages só aceita a `main`.
      # Um segundo workflow publicando a branch apagaria a oficial (ou seria
      # recusado). Então cada publicação oficial leva junto a beta mais recente,
      # compilada da branch `redesenho`; e um push na `redesenho` dispara este
      # workflow da `main` (o .github/workflows/beta.yml mora só naquela branch).
      #
      # A BETA NUNCA BARRA A OFICIAL: todo passo dela tem continue-on-error, e a
      # pasta só entra em dist/beta se testes e build passaram. Branch ausente,
      # teste vermelho ou build quebrado = a oficial sai igual, sem /beta/.
      #
      # A BETA NUNCA PUBLICA FUNÇÕES: é só o site. Mesmo banco e mesmo Kommo da
      # oficial — o que mexe em servidor entra pela `main`, com trava de admin.
      # Por isso a branch é recusada se tiver qualquer diferença em supabase/.
      # ======================================================================
      - name: Beta — código da branch redesenho
        id: beta_codigo
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: redesenho
          path: beta-src
          fetch-depth: 0

      - name: Beta — a branch não mexe no servidor
        id: beta_servidor
        if: steps.beta_codigo.outcome == 'success'
        continue-on-error: true
        working-directory: beta-src
        run: |
          mudou="$(git diff --name-only origin/main...HEAD -- supabase/)"
          if [ -n "$mudou" ]; then
            echo "::error::A branch redesenho mexe em supabase/ — a beta nunca publica funções:"
            echo "$mudou"
            exit 1
          fi

      # Os testes rodam no Node 22 (o supabase-js exige WebSocket nativo; ver o
      # job testes), e o build no 20, como o oficial.
      - name: Beta — Node 22 para os testes
        id: beta_node22
        if: steps.beta_servidor.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Beta — dependências e testes
        id: beta_testes
        if: steps.beta_node22.outcome == 'success'
        continue-on-error: true
        working-directory: beta-src
        run: |
          npm ci
          npm test

      - name: Beta — Node 20 para o build
        id: beta_node20
        if: steps.beta_testes.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Beta — build
        id: beta_build
        if: steps.beta_node20.outcome == 'success'
        continue-on-error: true
        working-directory: beta-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_CANAL: beta
        run: npm run build

      - name: Beta — junta ao site
        if: steps.beta_build.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf dist/beta
          cp -r beta-src/dist dist/beta
          echo "Beta publicada junto: $(cd beta-src && git log -1 --format='%h %s')"

      # ======================================================================
      # A VERSÃO CLÁSSICA, em /gestaodecreditos/classica/ — a última oficial antes
      # do redesenho (tag `classica`), no ar como VOLTA DE EMERGÊNCIA desde a
      # virada de 03/10/2026: se uma tela nova travar alguém, a clássica abre com
      # o mesmo login, o mesmo banco e o mesmo Kommo.
      #
      # CONGELADA: compila sempre a mesma tag, sem testes (passaram quando ela
      # era a oficial). Como a beta, nunca barra a oficial (continue-on-error) e
      # nunca publica funções. Servidor que mude depois pode deixá-la para trás —
      # é volta por alguns dias, não segunda plataforma. Para tirá-la do ar,
      # apague estes passos.
      # ======================================================================
      - name: Clássica — código da tag classica
        id: classica_codigo
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: classica
          path: classica-src

      - name: Clássica — Node 20 para o build
        id: classica_node
        if: steps.classica_codigo.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Clássica — build
        id: classica_build
        if: steps.classica_node.outcome == 'success'
        continue-on-error: true
        working-directory: classica-src
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build

      - name: Clássica — junta ao site
        if: steps.classica_build.outcome == 'success'
        continue-on-error: true
        run: |
          rm -rf dist/classica
          cp -r classica-src/dist dist/classica
          echo "Clássica publicada junto: $(cd classica-src && git log -1 --format='%h %s')"

      # As três actions de Pages sobem JUNTAS, porque a GitHub as versiona em
      # conjunto: configure v5->v6, upload-pages-artifact v3->v5 e deploy v4->v5.
      # A do upload é a que resolve o `upload-artifact@v4` que aparecia no aviso
      # sem estar escrito em lugar nenhum daqui — ele é chamado por dentro dela,
      # e a v5 já traz a v7.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
